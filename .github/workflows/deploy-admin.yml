name: Deploy Admin Console

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build admin console
        working-directory: admin
        run: |
          npm ci
          npm run build

      - name: Siapkan kunci SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Tes koneksi SSH
        run: ssh -i ~/.ssh/id_ed25519 "$SSH_TARGET" "echo koneksi-ok"

      - name: Upload ke server
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" admin/dist/ "$SSH_TARGET:/var/www/kkcs-admin/"

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://www.kopkkcs-gcs.tech/)
          echo "HTTP $code"
          test "$code" = "200"
