name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build dan publish
        working-directory: backend
        run: |
          dotnet build -c Release
          dotnet publish -c Release -o "$RUNNER_TEMP/publish"

      - name: Siapkan kunci SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Tes koneksi SSH
        run: ssh -i ~/.ssh/id_ed25519 "$SSH_TARGET" "echo koneksi-ok"

      - name: Terapkan migrasi ke database production
        working-directory: backend
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet tool install --global dotnet-ef --version "10.*"
          # Lewat database update langsung (per-statement via ADO.NET), bukan skrip SQL teks —
          # skrip teks (migrations script) gagal pada migrasi lama yang berisi CREATE TRIGGER mentah,
          # karena SQL Server mewajibkan CREATE TRIGGER jadi satu-satunya statement dalam batch-nya.
          ssh -i ~/.ssh/id_ed25519 -f -N -L 15433:127.0.0.1:1433 "$SSH_TARGET"
          sleep 2
          dotnet ef database update --no-build --configuration Release --connection \
            "Server=127.0.0.1,15433;Database=db-kkcs;User Id=sa;Password=${{ secrets.SA_PASSWORD_PROD }};TrustServerCertificate=True;MultipleActiveResultSets=True"

      - name: Upload backend dan restart service
        run: |
          rsync -az --no-perms --omit-dir-times -e "ssh -i ~/.ssh/id_ed25519" "$RUNNER_TEMP/publish/" "$SSH_TARGET:/opt/kkcs-backend/"
          ssh -i ~/.ssh/id_ed25519 "$SSH_TARGET" "sudo systemctl restart kkcs-backend && sleep 3 && systemctl is-active kkcs-backend"

      - name: Smoke test API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://api.kopkkcs-gcs.tech/api/auth/me)
          echo "HTTP $code"
          test "$code" = "401"
