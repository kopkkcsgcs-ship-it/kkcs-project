name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build dan publish
        working-directory: backend
        run: |
          dotnet build -c Release
          dotnet publish -c Release -o "$RUNNER_TEMP/publish"

      - name: Buat skrip migrasi database (idempotent)
        working-directory: backend
        run: |
          dotnet tool install --global dotnet-ef --version "10.*"
          dotnet ef migrations script --idempotent --no-build -o "$RUNNER_TEMP/migrations.sql"

      - name: Siapkan kunci SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Terapkan migrasi ke database production
        run: |
          scp -i ~/.ssh/id_ed25519 "$RUNNER_TEMP/migrations.sql" "$SSH_TARGET:/tmp/kkcs-migrations.sql"
          ssh -i ~/.ssh/id_ed25519 "$SSH_TARGET" "sudo /usr/local/bin/kkcs-apply-sql /tmp/kkcs-migrations.sql"

      - name: Upload backend dan restart service
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_ed25519" "$RUNNER_TEMP/publish/" "$SSH_TARGET:/opt/kkcs-backend/"
          ssh -i ~/.ssh/id_ed25519 "$SSH_TARGET" "sudo systemctl restart kkcs-backend && sleep 3 && systemctl is-active kkcs-backend"

      - name: Smoke test API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://api.kopkkcs-gcs.tech/api/auth/me)
          echo "HTTP $code"
          test "$code" = "401"
